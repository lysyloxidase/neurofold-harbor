schema_version = "1.4"
reward = "continuous"

[task]
name = "neurofold/als-ftd-tdp43-v8"
version = "8.0.0"
description = "Edge-aware, history-dependent conformational-control benchmark for a TDP-43 dimer (TDP-43 low-complexity domain fragment): suppress pathological beta-register maturation via contact-selective destabilisation."
authors = [{ name = "NeuroFold-Harbor" }]
keywords = [
  "reinforcement-learning",
  "graph-neural-network",
  "protein",
  "neurodegeneration",
  "ai-for-science",
  "harbor",
  "sequential-decision-making",
  "als",
  "ftd",
  "tdp-43",
]

[metadata]
difficulty = "unbenchmarked"
category = "ai-for-science"
reward_type = "continuous"
scientific_scope = "Physics-informed coarse-grained stochastic conformational-control benchmark at 5 residues per bead. Not atomistic MD, not a folding free-energy predictor, not a disease simulator."
disease = "ALS / FTD"
protein = "TDP-43 low-complexity domain fragment (UniProt Q13148, residues 311-360)"
action_space = "(i, j, strength): contact-selective energy modulation of pair (i,j) followed by ordinary Metropolis relaxation; not a mechanical force"
version_notes = "v8: two-chain dimer; non-separable pair chemistry so partner identity matters; directional saturable beta term and saturable polar-zipper term; maturation/locking hysteresis so action ORDER matters; irreversible damage from physical events only; partial observability; action budget. Extensive parameters normalised by measured mass ratios, not fitted. Porting gate: 6 PASS, 1 INCONCLUSIVE (P7), 1 FAIL (P8 catastrophe controllable under hand-coded probes). A learned reference controller trained with the standard pipeline reaches 8.59% catastrophe on 256 fresh seeds. See the validation note in instruction.md — both results are reported together."

[agent]
timeout_sec = 3600.0

[verifier]
timeout_sec = 1800.0
environment_mode = "separate"

[environment]
build_timeout_sec = 900.0
cpus = 2
memory_mb = 4096
storage_mb = 4096
network_mode = "no-network"

[verifier.environment]
build_timeout_sec = 900.0
cpus = 4
memory_mb = 4096
storage_mb = 4096
network_mode = "no-network"
