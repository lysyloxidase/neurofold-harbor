schema_version = "1.4"
reward = "continuous"

[task]
name = "neurofold/alzheimer-abeta42-v8"
version = "8.0.0"
description = "Edge-aware, history-dependent conformational-control benchmark for an amyloid-beta 42 dimer: suppress pathological beta-register maturation via contact-selective destabilisation."
authors = [{ name = "NeuroFold-Harbor" }]
keywords = [
  "reinforcement-learning",
  "graph-neural-network",
  "protein",
  "neurodegeneration",
  "ai-for-science",
  "harbor",
  "sequential-decision-making",
]

[metadata]
difficulty = "unbenchmarked"
category = "ai-for-science"
reward_type = "continuous"
scientific_scope = "Physics-informed coarse-grained stochastic conformational-control benchmark at 5 residues per bead. Not atomistic MD, not a folding free-energy predictor, not a disease simulator."
disease = "Alzheimer's disease"
protein = "amyloid-beta 42 (two-chain)"
action_space = "(i, j, strength): contact-selective energy modulation of pair (i,j) followed by ordinary Metropolis relaxation; not a mechanical force"
version_notes = "v8: two-chain dimer; non-separable pair chemistry so partner identity matters; directional saturable beta term; maturation/locking hysteresis so action ORDER matters; irreversible damage from physical events only; partial observability (latent oxidative stress and chaperone capacity); action budget. A1 (full graph controller vs edge-ablated controller) measured +0.557, 95% CI [+0.126, +0.698], but that is NOT a necessity result: the ablation arm is a crippled graph controller, not a cheap one. A3 (<=40-parameter controller must stay below 95% of full-policy gain) FAILS: a hand-set 3-weight policy reaches 96.7%. See agentic/reports/audits/v8.0_shortcut_finding.md."

[agent]
timeout_sec = 3600.0

[verifier]
timeout_sec = 1800.0
environment_mode = "separate"

[environment]
build_timeout_sec = 900.0
cpus = 2
memory_mb = 4096
storage_mb = 4096
network_mode = "no-network"

[verifier.environment]
build_timeout_sec = 900.0
cpus = 4
memory_mb = 4096
storage_mb = 4096
network_mode = "no-network"
