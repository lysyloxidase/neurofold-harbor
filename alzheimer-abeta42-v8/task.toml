schema_version = "1.4"
reward = "continuous"

[task]
name = "neurofold/alzheimer-abeta42-v8"
version = "8.0.0"
description = "Edge-aware, history-dependent conformational-control benchmark for an amyloid-beta 42 dimer: suppress pathological beta-register maturation via contact-selective destabilisation."
authors = [{ name = "NeuroFold-Harbor" }]
keywords = [
  "reinforcement-learning",
  "graph-neural-network",
  "protein",
  "neurodegeneration",
  "ai-for-science",
  "harbor",
  "sequential-decision-making",
]

[metadata]
difficulty = "unbenchmarked"
category = "ai-for-science"
reward_type = "continuous"
scientific_scope = "Physics-informed coarse-grained stochastic conformational-control benchmark at 5 residues per bead. Not atomistic MD, not a folding free-energy predictor, not a disease simulator."
disease = "Alzheimer's disease"
protein = "amyloid-beta 42 (two-chain)"
action_space = "(i, j, strength): contact-selective energy modulation of pair (i,j) followed by ordinary Metropolis relaxation; not a mechanical force"
version_notes = "v8: two-chain dimer; non-separable pair chemistry so partner identity matters; directional saturable beta term; maturation/locking hysteresis so action ORDER matters; irreversible damage from physical events only; partial observability (latent oxidative stress and chaperone capacity); action budget. Relational necessity verified (full graph controller vs local-only: +0.557, 95% CI [+0.126, +0.698])."

